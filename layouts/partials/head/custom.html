<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacking Theme - Matrix Effects</title>
    <link rel="stylesheet" href="custom.css">
    <style>
        #fireworks-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }
        
        .matrix-controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            gap: 15px;
            flex-direction: row-reverse;
        }

        .matrix-btn {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00ff00;
            color: #00ff00;
            padding: 12px 24px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            user-select: none;
            white-space: nowrap;
        }

        .matrix-btn:hover {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.6);
            transform: translateY(-2px);
        }

        .matrix-btn:active {
            transform: translateY(0);
        }

        .matrix-btn.paused {
            border-color: #ff0000;
            color: #ff0000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
        }

        .matrix-btn.paused:hover {
            background: #ff0000;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.6);
        }

        @keyframes btnPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .matrix-btn.pulse {
            animation: btnPulse 0.3s ease;
        }
    </style>
</head>
<body>
    <!-- Scanline Overlay -->
    <div class="dot-overlay"></div>

    <!-- Main Content -->
    <div style="position: relative; z-index: 10; max-width: 1200px; margin: 0 auto; padding: 50px 20px; min-height: 100vh;">
        
        <section style="text-align: center; margin-bottom: 80px; padding: 60px 0;">
            <h1 style="font-size: 72px; margin-bottom: 20px; font-weight: bold;">
                CYBER SECURITY
            </h1>
            <p style="font-size: 24px; opacity: 0.8; margin-bottom: 40px;">
                System breached successfully... Click anywhere for fireworks!
            </p>
            
            <div style="display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin: 40px 0;">
                <button class="neon-button">INITIALIZE HACK</button>
                <button class="ripple-button">DECRYPT DATA</button>
                <button class="glow-button">BYPASS FIREWALL</button>
            </div>
        </section>

        <section style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; margin: 60px 0;">
            <div class="swipe-card">
                <h3 style="font-size: 24px; margin-bottom: 15px;">⚡ Matrix Rain</h3>
                <p>Hiệu ứng mưa matrix với control buttons</p>
            </div>
            
            <div class="swipe-card">
                <h3 style="font-size: 24px; margin-bottom: 15px;">🎆 Fireworks</h3>
                <p>Click anywhere để tạo pháo hoa</p>
            </div>
            
            <div class="swipe-card">
                <h3 style="font-size: 24px; margin-bottom: 15px;">🎨 Color Change</h3>
                <p>Đổi màu matrix rain với button</p>
            </div>
        </section>

        <footer style="text-align: center; padding: 40px 0; margin-top: 80px; opacity: 0.6;">
            <p>Created by Tung | Penetration Tester & CTF Player</p>
            <p style="margin-top: 10px;">⚡ HACK THE PLANET ⚡</p>
        </footer>

    </div>

    <!-- Matrix Rain Effect -->
    <script>
    (function() {
        'use strict';
        
        window.matrixConfig = {
            color: '#0F0',
            isRunning: true,
            animationId: null
        };
        
        function initMatrix() {
            const canvas = document.createElement('canvas');
            canvas.id = 'matrix-canvas';
            canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;opacity:0.8;pointer-events:none;transition:opacity 0.3s ease';
            
            if (document.body.firstChild) {
                document.body.insertBefore(canvas, document.body.firstChild);
            } else {
                document.body.appendChild(canvas);
            }
            
            const ctx = canvas.getContext('2d');
            let w = canvas.width = window.innerWidth;
            let h = canvas.height = window.innerHeight;
            
            const chars = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッンABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            const fontSize = 16;
            let cols = Math.floor(w / fontSize);
            const drops = [];
            
            for (let i = 0; i < cols; i++) {
                drops[i] = Math.floor(Math.random() * h / fontSize);
            }
            
            function draw() {
                if (!window.matrixConfig.isRunning) return;
                
                ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                ctx.fillRect(0, 0, w, h);
                
                ctx.fillStyle = window.matrixConfig.color;
                ctx.font = fontSize + 'px monospace';
                
                for (let i = 0; i < drops.length; i++) {
                    const text = chars[Math.floor(Math.random() * chars.length)];
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                    
                    if (drops[i] * fontSize > h && Math.random() > 0.975) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                }
                
                window.matrixConfig.animationId = requestAnimationFrame(draw);
            }
            
            draw();
            
            window.addEventListener('resize', function() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
                cols = Math.floor(w / fontSize);
                drops.length = cols;
                for (let i = 0; i < cols; i++) {
                    drops[i] = Math.floor(Math.random() * h / fontSize);
                }
            });
            
            window.pauseMatrix = function() {
                window.matrixConfig.isRunning = false;
                if (window.matrixConfig.animationId) {
                    cancelAnimationFrame(window.matrixConfig.animationId);
                }
            };
            
            window.resumeMatrix = function() {
                if (!window.matrixConfig.isRunning) {
                    window.matrixConfig.isRunning = true;
                    draw();
                }
            };
            
            window.setMatrixColor = function(color) {
                window.matrixConfig.color = color;
            };
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initMatrix);
        } else {
            initMatrix();
        }
    })();
    </script>

    <!-- Control Buttons -->
    <script>
    (function() {
        'use strict';
        
        function initControls() {
            const container = document.createElement('div');
            container.className = 'matrix-controls';
            document.body.appendChild(container);
            
            // PAUSE/PLAY BUTTON
            const pauseBtn = document.createElement('button');
            pauseBtn.className = 'matrix-btn';
            pauseBtn.innerHTML = '⏸ PAUSE';
            container.appendChild(pauseBtn);
            
            let isRunning = true;
            
            pauseBtn.addEventListener('click', function() {
                isRunning = !isRunning;
                
                if (isRunning) {
                    if (window.resumeMatrix) window.resumeMatrix();
                    const canvas = document.getElementById('matrix-canvas');
                    if (canvas) canvas.style.opacity = '0.8';
                    pauseBtn.innerHTML = '⏸ PAUSE';
                    pauseBtn.classList.remove('paused');
                } else {
                    if (window.pauseMatrix) window.pauseMatrix();
                    const canvas = document.getElementById('matrix-canvas');
                    if (canvas) canvas.style.opacity = '0';
                    pauseBtn.innerHTML = '▶ PLAY';
                    pauseBtn.classList.add('paused');
                }
                
                pauseBtn.classList.add('pulse');
                setTimeout(() => pauseBtn.classList.remove('pulse'), 300);
            });
            
            // COLOR BUTTON
            const colorBtn = document.createElement('button');
            colorBtn.className = 'matrix-btn';
            colorBtn.innerHTML = '🎨 GREEN';
            container.appendChild(colorBtn);
            
            const colors = [
                { name: 'GREEN', hex: '#0F0' },
                { name: 'CYAN', hex: '#0FF' },
                { name: 'BLUE', hex: '#08F' },
                { name: 'PURPLE', hex: '#F0F' },
                { name: 'RED', hex: '#F00' },
                { name: 'ORANGE', hex: '#F80' },
                { name: 'YELLOW', hex: '#FF0' },
                { name: 'PINK', hex: '#F6B' },
                { name: 'WHITE', hex: '#FFF' }
            ];
            
            let colorIndex = 0;
            
            colorBtn.addEventListener('click', function() {
                colorIndex = (colorIndex + 1) % colors.length;
                const color = colors[colorIndex];
                
                if (window.setMatrixColor) {
                    window.setMatrixColor(color.hex);
                }
                
                colorBtn.innerHTML = '🎨 ' + color.name;
                colorBtn.style.borderColor = color.hex;
                colorBtn.style.color = color.hex;
                colorBtn.style.boxShadow = `0 0 20px ${color.hex}80`;
                
                colorBtn.classList.add('pulse');
                setTimeout(() => colorBtn.classList.remove('pulse'), 300);
            });
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                setTimeout(initControls, 600);
            });
        } else {
            setTimeout(initControls, 600);
        }
    })();
    </script>

    <!-- Fireworks Effect on Click -->
    <script>
    (function() {
        'use strict';
        
        function initFireworks() {
            const canvas = document.createElement('canvas');
            canvas.id = 'fireworks-canvas';
            document.body.appendChild(canvas);
            
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const particles = [];
            
            class Particle {
                constructor(x, y, color) {
                    this.x = x;
                    this.y = y;
                    this.color = color;
                    this.velocity = {
                        x: (Math.random() - 0.5) * 8,
                        y: (Math.random() - 0.5) * 8
                    };
                    this.alpha = 1;
                    this.decay = Math.random() * 0.015 + 0.015;
                    this.size = Math.random() * 3 + 2;
                }
                
                update() {
                    this.velocity.x *= 0.98;
                    this.velocity.y *= 0.98;
                    this.velocity.y += 0.15;
                    
                    this.x += this.velocity.x;
                    this.y += this.velocity.y;
                    this.alpha -= this.decay;
                }
                
                draw() {
                    ctx.save();
                    ctx.globalAlpha = this.alpha;
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }
            
            function createFirework(x, y) {
                const colors = ['#00ff00', '#00ff41', '#39ff14', '#0ff', '#0f0', '#ff0', '#f0f'];
                const particleCount = 50;
                
                for (let i = 0; i < particleCount; i++) {
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    particles.push(new Particle(x, y, color));
                }
            }
            
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update();
                    particles[i].draw();
                    
                    if (particles[i].alpha <= 0) {
                        particles.splice(i, 1);
                    }
                }
                
                requestAnimationFrame(animate);
            }
            
            animate();
            
            document.addEventListener('click', function(e) {
                createFirework(e.clientX, e.clientY);
            });
            
            window.addEventListener('resize', function() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initFireworks);
        } else {
            initFireworks();
        }
    })();
    </script>

</body>
</html>
